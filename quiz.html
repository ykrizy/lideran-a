<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Transformacional e Autêntica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column, one question at a time, like a game show card on a phone */
:root{
  --bg:#f5f3f6; --surface:#ffffff; --fg:#1d1a22; --muted:#6c6574; --line:#e3dee8;
  --trans:#b4141e; --trans-soft:#fbe9ea;
  --aut:#6a46a3; --aut-soft:#efe9f8;
  --ok:#1d7a4a; --ok-soft:#e3f4ea; --bad:#b4141e; --bad-soft:#fbe9ea;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141218; --surface:#1e1b24; --fg:#f1edf5; --muted:#a69db0; --line:#332e3b;
  --trans:#f0626a; --trans-soft:#3a1a1e; --aut:#b398e6; --aut-soft:#2a2140;
  --ok:#58c98a; --ok-soft:#173326; --bad:#f0626a; --bad-soft:#3a1a1e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141218; --surface:#1e1b24; --fg:#f1edf5; --muted:#a69db0; --line:#332e3b;
  --trans:#f0626a; --trans-soft:#3a1a1e; --aut:#b398e6; --aut-soft:#2a2140;
  --ok:#58c98a; --ok-soft:#173326; --bad:#f0626a; --bad-soft:#3a1a1e; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:24px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-0.01em}
h1{font-size:clamp(2rem,8vw,2.8rem);line-height:1.02;font-weight:800}
h1 .t{color:var(--trans)} h1 .a{color:var(--aut)}
h2{font-size:1.35rem;line-height:1.25;font-weight:700}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
p{margin:0}
.lead{color:var(--muted);max-width:60ch}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pill{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.pill.t{background:var(--trans-soft)} .pill.a{background:var(--aut-soft)}
.pill b{font-family:var(--display);font-size:1.05rem}
.pill.t b{color:var(--trans)} .pill.a b{color:var(--aut)}
.pill span{font-size:.85rem;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem}
input[type=text]{font:inherit;font-weight:500;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
input[type=text]:focus-visible{outline:none;border-color:var(--aut)}
.btn{font:inherit;font-weight:700;font-size:1rem;border:0;border-radius:12px;padding:14px 18px;cursor:pointer;background:var(--fg);color:var(--bg)}
.btn:hover{opacity:.9} .btn:focus-visible{outline:3px solid var(--aut);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--fg);transition:width .3s}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.tag.t{background:var(--trans-soft);color:var(--trans)} .tag.a{background:var(--aut-soft);color:var(--aut)}
.tag.ta{background:linear-gradient(90deg,var(--trans-soft),var(--aut-soft));color:var(--fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;gap:16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;text-align:left;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;display:flex;gap:12px;align-items:flex-start;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--fg)}
.opt:focus-visible{outline:3px solid var(--aut);outline-offset:2px}
.opt .k{font-family:var(--display);font-weight:700;color:var(--muted);min-width:1.2em}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{color:var(--bad)}
.feedback{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.feedback.ok{background:var(--ok-soft)} .feedback.no{background:var(--bad-soft)}
.feedback strong{font-family:var(--display);font-size:1.05rem}
.feedback.ok strong{color:var(--ok)} .feedback.no strong{color:var(--bad)}
.score{font-family:var(--display);font-weight:800;font-size:4rem;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:1.4rem;color:var(--muted);font-weight:600}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.review{display:flex;flex-direction:column;gap:8px}
.review div{display:flex;gap:10px;font-size:.9rem;align-items:flex-start}
.review b{min-width:1.4em;font-family:var(--display)}
.review .y{color:var(--ok)} .review .n{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 160px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
const Q = [
 {th:"t", q:"Quem criou o conceito de liderança transformacional, ao estudar líderes políticos?",
  o:["Robert Greenleaf (1970)","James MacGregor Burns (1978)","Kim Cameron (2008)","Owens e Hekman (2012)"], c:1,
  e:"Burns (1978) criou o conceito. Bass (1985) levou-o para as organizações e para a gestão."},
 {th:"t", q:"Qual destas opções NÃO é um dos 4 «I» da liderança transformacional?",
  o:["Consideração individualizada","Estimulação intelectual","Incentivo financeiro","Motivação inspiradora"], c:2,
  e:"Os 4 «I» são influência idealizada, motivação inspiradora, estimulação intelectual e consideração individualizada. Trocar dinheiro por metas é transacional."},
 {th:"t", q:"A líder diz: «Não quero que façam assim só porque sempre se fez. Tragam-me ideias novas, mesmo que falhem.» Que «I» é este?",
  o:["Influência idealizada","Consideração individualizada","Estimulação intelectual","Motivação inspiradora"], c:2,
  e:"Desafiar a equipa a questionar e a inovar sem medo de errar é estimulação intelectual."},
 {th:"t", q:"O líder marca conversas 1:1 com cada pessoa para perceber os objetivos de carreira de cada uma. Que «I» é este?",
  o:["Consideração individualizada","Motivação inspiradora","Influência idealizada","Estimulação intelectual"], c:0,
  e:"Tratar cada pessoa como única, como um mentor, é consideração individualizada."},
 {th:"t", q:"Qual é a grande diferença entre a liderança transformacional e a transacional?",
  o:["A transacional é mais recente","A transformacional muda a motivação das pessoas, enquanto a transacional troca recompensas por metas","A transformacional não define objetivos","São a mesma coisa com nomes diferentes"], c:1,
  e:"A transacional funciona por troca. A transformacional faz as pessoas irem além do interesse próprio. Bass vê-as como complementares: a transformacional acrescenta-se à transacional."},
 {th:"t", q:"Um líder inspira multidões, mas usa isso para benefício próprio. Como chama Bass a isto?",
  o:["Liderança servidora","Liderança pseudo-transformacional","Liderança positiva","Liderança laissez-faire"], c:1,
  e:"Bass e Steidlmeier (1999) chamam-lhe pseudo-transformacional: inspira, mas sem base ética. É por isso que a autenticidade faz falta."},
 {th:"a", q:"Segundo o slide da aula, quem são os autores de referência da liderança autêntica?",
  o:["Burns (1978)","Greenleaf (1970)","Avolio e Gardner (2005)","Cameron (2008)"], c:2,
  e:"Avolio e Gardner (2005) desenvolveram o modelo. O conceito ficou conhecido também pelo livro de Bill George (2003), ex-CEO da Medtronic."},
 {th:"a", q:"Antes de decidir, a líder pede de propósito a opinião de quem discorda dela. Que componente da autêntica é esta?",
  o:["Autoconsciência","Processamento equilibrado da informação","Transparência relacional","Motivação inspiradora"], c:1,
  e:"Analisar a informação de forma objetiva, incluindo opiniões contrárias, é processamento equilibrado."},
 {th:"a", q:"O chefe admite à equipa que errou no planeamento e explica como se sentiu com isso. Que componente é esta?",
  o:["Perspetiva moral internalizada","Transparência relacional","Estimulação intelectual","Processamento equilibrado"], c:1,
  e:"Mostrar-se de forma genuína, sem máscara, é transparência relacional."},
 {th:"a", q:"A diretora recusa «ajustar» os números do relatório, apesar da pressão da administração. Que componente é esta?",
  o:["Autoconsciência","Consideração individualizada","Perspetiva moral internalizada","Transparência relacional"], c:2,
  e:"Agir segundo os próprios valores, mesmo sob pressão externa, é perspetiva moral internalizada."},
 {th:"a", q:"Que acontecimentos fizeram crescer o interesse pela liderança autêntica?",
  o:["A revolução industrial","Escândalos como a Enron e a crise financeira de 2008","A chegada das redes sociais","A pandemia de 2020"], c:1,
  e:"Depois dos escândalos empresariais e da crise de 2008, as organizações perderam confiança e passaram a procurar líderes coerentes e éticos."},
 {th:"a", q:"Alvesson e Einola (2019), nas referências da aula, criticam a liderança autêntica. Qual é a crítica principal?",
  o:["É demasiado autoritária","Tem excesso de positividade e é um conceito idealizado e vago","Só funciona em fábricas","Ignora as recompensas"], c:1,
  e:"Avisam contra o excesso de positividade. A resposta: o modelo tem componentes concretas e mensuráveis (questionário ALQ), e a perspetiva moral impede o «autenticamente mau»."},
 {th:"ta", q:"Pelas bases de poder de French e Raven, que poder alimenta mais as duas teorias?",
  o:["Coercivo","Recompensa","Referência","Legítimo"], c:2,
  e:"Ambas assentam na admiração e na confiança, ou seja, poder de referência. A transformacional usa também o pericial, e a autêntica o informacional, porque partilha a informação."},
 {th:"ta", q:"Porque defendemos as duas juntas?",
  o:["Porque são iguais","Porque a transformacional dá visão e mudança, e a autêntica dá a base ética que impede a manipulação","Porque ambas usam bónus","Porque são as mais antigas"], c:1,
  e:"Transformacional sem autenticidade pode virar manipulação. Autenticidade sem visão não leva a equipa a lado nenhum. Juntas, dão rumo com confiança."}
];
const TH = {t:"Transformacional", a:"Autêntica", ta:"As duas"};
const app = document.getElementById("app");
let name = "", i = 0, answers = [];

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function start(){
  app.innerHTML = `
  <div class="eyebrow">Liderança · Aula 03 · Debate</div>
  <h1><span class="t">Transformacional</span> e <span class="a">Autêntica</span></h1>
  <p class="lead">${Q.length} perguntas sobre as duas teorias que defendemos. Depois de cada resposta vês a explicação. No fim, mostra o resultado ao grupo.</p>
  <div class="pair">
    <div class="pill t"><b>Transformacional</b><span>Inspira e dá sentido. Burns (1978), Bass (1985)</span></div>
    <div class="pill a"><b>Autêntica</b><span>Coerência entre valores e ação. Avolio e Gardner (2005)</span></div>
  </div>
  <label class="f" for="nm">O teu nome<input type="text" id="nm" placeholder="Ex.: Joana" maxlength="30" value="${esc(name)}"></label>
  <button class="btn" id="go">Começar o quiz</button>`;
  const go = () => { name = document.getElementById("nm").value.trim(); i = 0; answers = []; ask(); };
  document.getElementById("go").onclick = go;
  document.getElementById("nm").onkeydown = e => { if(e.key==="Enter") go(); };
}

function ask(){
  const q = Q[i];
  app.innerHTML = `
  <div class="meta"><span>Pergunta ${i+1} de ${Q.length}</span><span>${answers.filter(a=>a).length} certas</span></div>
  <div class="bar"><i style="width:${(i/Q.length)*100}%"></i></div>
  <div class="card">
    <div><span class="tag ${q.th}">${TH[q.th]}</span></div>
    <h2>${esc(q.q)}</h2>
    <div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div id="fb"></div>
  </div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.k));
}

function pick(k){
  const q = Q[i], ok = k === q.c;
  answers.push(ok);
  app.querySelectorAll(".opt").forEach((b,n) => {
    b.disabled = true;
    if(n === q.c) b.classList.add("right");
    else if(n === k) b.classList.add("wrong");
  });
  const last = i === Q.length - 1;
  document.getElementById("fb").innerHTML = `
    <div class="feedback ${ok?"ok":"no"}"><strong>${ok?"Certo!":"Não é essa."}</strong><p>${esc(q.e)}</p></div>
    <button class="btn" id="nx" style="margin-top:12px;width:100%">${last?"Ver resultado":"Próxima pergunta"}</button>`;
  const nx = document.getElementById("nx");
  nx.focus({preventScroll:true});
  nx.scrollIntoView({block:"nearest",behavior:"smooth"});
  nx.onclick = () => { i++; last ? finish() : ask(); };
}

function finish(){
  const total = answers.filter(a=>a).length;
  const by = th => { let r=0,n=0; Q.forEach((q,k)=>{ if(q.th===th||q.th==="ta"&&th==="x"){} if(q.th===th){n++; if(answers[k]) r++;} }); return [r,n]; };
  const [tr,tn] = by("t"), [ar,an] = by("a");
  const pct = total / Q.length;
  const msg = pct>=.85 ? "Dominas as duas teorias. Estás pronto para defender o nosso lado."
           : pct>=.6 ? "Percebeste o essencial. Revê as explicações das que falhaste."
           : "Ainda há confusão entre as componentes. Revê os 4 «I» e as 4 componentes da autêntica.";
  app.innerHTML = `
  <div class="eyebrow">Resultado${name?" de "+esc(name):""}</div>
  <div class="score">${total}<small> / ${Q.length}</small></div>
  <p class="lead">${msg}</p>
  <div class="split">
    <div class="pill t"><b>${tr} / ${tn}</b><span>Transformacional</span></div>
    <div class="pill a"><b>${ar} / ${an}</b><span>Autêntica</span></div>
  </div>
  <div class="card"><h2>Revisão</h2><div class="review">
    ${Q.map((q,k)=>`<div><b class="${answers[k]?"y":"n"}">${answers[k]?"✓":"✗"}</b><span>${esc(q.q)}<br><span style="color:var(--muted)">${esc(q.o[q.c])}</span></span></div>`).join("")}
  </div></div>
  <div class="row"><button class="btn" id="again">Jogar outra vez</button><button class="btn ghost" id="next">Próximo colega</button></div>`;
  document.getElementById("again").onclick = () => { i=0; answers=[]; ask(); };
  document.getElementById("next").onclick = () => { name=""; start(); };
}
start();
</script>
</body>
</html>
